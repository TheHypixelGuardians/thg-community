name: release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 1.2.0). Leave empty to use package.json.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi

          # Accept X.Y.Z only — no prerelease / build metadata.
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version '$VERSION' is not a plain X.Y.Z semver — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          TAG="v$VERSION"

          # Minor and major releases only (patch component must be 0).
          if [ "$PATCH" != "0" ]; then
            echo "Version $VERSION is a patch release — skipping GitHub Release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On push, only act when package.json actually changed the version
          # (or this is the first commit that introduced it).
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              OLD_VERSION="$(git show "${BEFORE}:package.json" 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" \
                || true)"
              if [ -n "${OLD_VERSION:-}" ] && [ "$OLD_VERSION" = "$VERSION" ]; then
                echo "package.json changed but version is still $VERSION — skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          # Duplicate guard: never create a second release/tag for the same version.
          git fetch --tags --force origin >/dev/null 2>&1 || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping duplicate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping duplicate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "title=Version $VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Will release $VERSION (tag $TAG) — ${MAJOR}.${MINOR}.0"

      - name: Extract changelog section
        id: changelog
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing — create it before releasing."
            exit 1
          fi

          HEADING="## Version ${VERSION}"
          if ! grep -qxF "$HEADING" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '$HEADING' section. Rename ## Unreleased before releasing."
            exit 1
          fi

          # Body = everything under this heading until the next ## heading (exclusive).
          # Drop a single leading blank line if present; keep the rest intact.
          BODY="$(awk -v heading="$HEADING" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture {
              if (started || $0 != "") started = 1
              if (started) print
            }
          ' CHANGELOG.md)"

          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::Changelog section for Version ${VERSION} is empty."
            exit 1
          fi

          printf '%s\n' "$BODY" > release-notes.md
          echo "Extracted notes for Version ${VERSION}:"
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          set -euo pipefail

          # Re-check immediately before create (race with a parallel run).
          if gh release view "$TAG" >/dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release or tag $TAG appeared while this job was running — skipping duplicate."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
